name: Synchronise Exophase telemetry

on:
  schedule:
    # GitHub schedules use UTC and are best effort, not an exact-time guarantee.
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      accept_removals:
        description: 'Reviewed source removals to accept, as comma-separated player:game IDs (leave empty normally)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'headless_exporter.py'
      - 'build_site.py'
      - 'tests/**'
      - 'index.html'
      - 'assets/**'
      - 'output/data.json'
      - 'output/art/**'
      - 'cache/telemetry_cache.json'

permissions:
  contents: read

concurrency:
  group: exophase-telemetry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the latest state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/workflows/sync.yml
      - name: Install the headless dependency
        run: python -m pip install --disable-pip-version-check requests==2.34.2
      - name: Run regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Refresh the complete public dataset
        env:
          EXOPHASE_PLAYER_ID: '5143228'
          EXOPHASE_ACCEPT_REMOVALS: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_removals || '' }}
        run: python -B headless_exporter.py
      - name: Prepare the public dashboard bundle
        run: python -B build_site.py --destination "$RUNNER_TEMP/telemetry-site"
      - name: Commit the verified state
        run: |
          mkdir -p output/art
          git add -A -- cache/telemetry_cache.json output/data.json output/art
          if ! git diff --cached --quiet -- cache/telemetry_cache.json output/data.json output/art; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh Exophase telemetry'
            git push origin HEAD:main
          fi
      - name: Upload the allowlisted Pages bundle
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/telemetry-site

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
